<style>
/* ===== الألوان: غيّرها من هنا فقط ===== */
:root{
  --primary:#2F6B57;      /* أخضر عميق (جدران/ديكور العيادة) */
  --primary-dark:#1F4A3C;
  --sage:#DCE5D5;         /* أخضر فاتح من خزائن العيادة */
  --cream:#FAF6EC;        /* لون الجدران الدافئ */
  --gold:#B8864B;         /* لمسة ذهبية من الإضاءة */
  --ink:#1F2D28;
  --muted:#58655F;
  --white:#fff;
  --wa:#1E9E55;
  --radius:16px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:78px}
body{font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.7;font-size:16px}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
.wrap{width:min(1100px,92%);margin-inline:auto}
section{padding:56px 0}
h2{font-size:1.7rem;line-height:1.3;color:var(--primary-dark);margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid transparent;font:700 1rem Cairo,Tahoma,sans-serif;cursor:pointer;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--gold);color:#fff}.btn-p:hover{background:#9c6f38}
.btn-o{border-color:#fff;color:#fff}.btn-o:hover{background:rgba(255,255,255,.15)}
.btn-g{background:var(--primary);color:#fff}.btn-g:hover{background:var(--primary-dark)}
.btn-w{background:var(--wa);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(250,246,236,.96);backdrop-filter:blur(6px);box-shadow:0 1px 8px rgba(0,0,0,.08)}
.bar{display:flex;align-items:center;gap:10px;height:72px}
.logo img{height:58px;width:auto;border-radius:8px}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
#menu{display:none;position:absolute;top:72px;inset-inline:0;background:var(--cream);padding:10px 4%;box-shadow:0 8px 12px rgba(0,0,0,.1)}
#menu.open{display:block}
#menu a{display:block;padding:10px 4px;border-bottom:1px solid #e5dfcf;font-weight:700}
#menu a.bk,.links a.bk{color:var(--gold)}
.links{display:none}
.lang,.burger{min-height:44px;min-width:44px;border:2px solid var(--primary);background:none;border-radius:10px;color:var(--primary-dark);font:700 .95rem Cairo,sans-serif;cursor:pointer}
.hbook{display:none}
@media(min-width:960px){.burger{display:none}.links{display:flex;gap:16px;font-weight:700;font-size:.95rem}.links a:hover{color:var(--gold)}.hbook{display:inline-flex;min-height:44px;padding:6px 18px}#menu{display:none!important}}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:128px 0 64px;background:linear-gradient(135deg,#1F4A3C,#2F6B57 55%,#3F7F66);isolation:isolate}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-size:clamp(1.9rem,6vw,3.1rem);line-height:1.25;max-width:760px;margin-bottom:14px}
.hero p{max-width:600px;font-size:1.1rem;opacity:.95;margin-bottom:26px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.trust{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:8px 16px;border-radius:999px;font-weight:700}
.fx{position:absolute;inset:0;z-index:1;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35;animation:fl 12s ease-in-out infinite}
.o1{width:280px;height:280px;background:#E6C58F;top:-60px;inset-inline-end:-40px}
.o2{width:220px;height:220px;background:#A8D5BF;bottom:-60px;inset-inline-start:10%;animation-delay:-5s}
.pt{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);animation:up 9s linear infinite}
.pt:nth-child(3){left:12%}.pt:nth-child(4){left:34%;animation-delay:-3s;width:5px;height:5px}.pt:nth-child(5){left:58%;animation-delay:-6s}.pt:nth-child(6){left:80%;animation-delay:-2s;width:6px;height:6px}
.hero:after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.1) 50%,transparent 60%);background-size:250% 100%;animation:sh 7s ease-in-out infinite;pointer-events:none}
@keyframes fl{50%{transform:translate(20px,26px)}}
@keyframes up{to{transform:translateY(-560px);opacity:0}}
@keyframes sh{0%{background-position:150% 0}100%{background-position:-50% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:0 2px 12px rgba(31,74,60,.08);display:flex;flex-direction:column;gap:8px}
.card h3{font-size:1.15rem;color:var(--primary-dark)}
.card p{color:var(--muted);flex:1}
.ic{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--sage),#fff);border:1px solid rgba(47,107,87,.2);display:grid;place-items:center}
.ic svg{width:32px;height:32px;stroke:var(--primary);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card.sv{padding-top:0;overflow:hidden}
.sm{width:calc(100% + 44px);max-width:none;margin:0 -22px 0;aspect-ratio:4/3;object-fit:cover;background:var(--sage)}
.sv .ic{margin-top:-30px;position:relative;border:3px solid #fff;background:var(--sage)}
.card .btn{min-height:44px;padding:6px 18px;margin-top:6px;align-self:flex-start}
@media(min-width:900px){#svc{grid-template-columns:repeat(3,1fr)}}
.alt{background:var(--sage)}
.alt .card{background:var(--cream)}
/* results */
.cmp{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:1;background:#ddd;direction:ltr;--p:50%;touch-action:pan-y}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cmp .b{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--p);width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 6px rgba(0,0,0,.4)}
.cmp .hd:after{content:"\2194";position:absolute;top:50%;left:50%;width:38px;height:38px;border-radius:50%;background:#fff;color:var(--primary);display:grid;place-items:center;transform:translate(-50%,-50%);font-weight:700}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.cmp:focus-within .hd:after{outline:3px solid var(--gold)}
.tag{position:absolute;top:10px;padding:2px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:.85rem;z-index:2}
.tl{left:10px}.tr{right:10px}
.cap{font-weight:700;text-align:center;margin-top:8px}
.note{color:var(--muted);text-align:center;margin-top:22px}
.note a{color:var(--primary);font-weight:700;text-decoration:underline}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.gal{grid-template-columns:repeat(3,1fr)}}
.gal button{border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;background:#ddd}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.gal button:hover img{transform:scale(1.05)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
#lb.open{display:flex}
#lb img{max-height:88vh;max-width:100%;width:auto;border-radius:8px}
#lb button{position:absolute;background:rgba(255,255,255,.2);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:1.6rem;cursor:pointer}
#lbx{top:14px;right:14px}#lbp{left:10px;top:50%}#lbn{right:10px;top:50%}
/* reviews */
.rv{direction:ltr;text-align:left}
.rv .top{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700}
.st{color:#F5B301;letter-spacing:2px}
.gl{font-size:.85rem;color:var(--muted)}
.rv p{color:var(--ink)}
/* form */
form{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:0 2px 12px rgba(31,74,60,.1);display:grid;gap:14px;max-width:680px;margin-inline:auto}
.row{display:grid;gap:14px}
@media(min-width:600px){.row{grid-template-columns:1fr 1fr}}
label{font-weight:700;display:block;margin-bottom:4px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid #cfd8d2;border-radius:10px;font:400 1rem Cairo,Tahoma,sans-serif;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--primary);outline:none}
.err{color:#B3261E;font-size:.88rem;min-height:1.2em}
.bad{border-color:#B3261E}
/* faq */
details{background:#fff;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
summary{padding:14px 18px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;min-height:48px;align-items:center}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:1.4rem;color:var(--gold)}
details[open] summary:after{content:"\2212"}
details p{padding:0 18px 16px;color:var(--muted)}
/* contact */
.hrs div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed #d9d2bf}.hrs div:last-child{border:0}.hrs b{color:var(--primary-dark)}.hrs .cl{color:#B3261E}
.ct{display:grid;gap:12px}
.ct .card{gap:4px}
.ct .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ct .btn{min-height:46px;padding:6px 18px}
/* footer */
footer{background:var(--primary-dark);color:#e8efe9;padding:34px 0 90px}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
footer img{height:60px;width:auto;border-radius:10px}
footer nav{display:flex;gap:14px;flex-wrap:wrap;margin:0}
footer small{width:100%;opacity:.75;text-align:center}
/* floating */
.fw,.fc{position:fixed;bottom:16px;z-index:60;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.3);color:#fff}
.fw{right:16px;background:var(--wa)}
.fc{left:16px;background:var(--primary)}
.fw svg,.fc svg{width:28px;height:28px;fill:#fff}
@media(min-width:760px){.fc{display:none}}
</style>
</head>

 var s="";SERVICES.forEach(function(v){s+='<article class="card sv"><img class="sm" src="'+v.m+'" width="480" height="360" alt="'+v[lang][0]+'" loading="lazy" decoding="async">'+ico(v.i)+'<h3>'+v[lang][0]+'</h3><p>'+v[lang][1]+'</p><a class="btn btn-g" href="#booking" data-svc="'+esc(v.ar[0])+'">'+t.svc_b+'</a></article>'});$("svc").innerHTML=s;
 s="";WHY.forEach(function(v){s+='<article class="card"><h3>'+v[lang][0]+'</h3><p>'+v[lang][1]+'</p></article>'});$("whyg").innerHTML=s;
 s="";GALLERY.forEach(function(g,n){s+='<button type="button" data-n="'+n+'" aria-label="'+g[lang]+'"><img src="'+g.s+'" width="'+g.w+'" height="'+g.h+'" alt="'+g[lang]+'" style="object-position:'+(g.p||"50% 50%")+'" loading="lazy" decoding="async"></button>'});$("galg").innerHTML=s;
 s="";REVIEWS.forEach(function(r){s+='<article class="card rv"><div class="top"><div class="av" aria-hidden="true">'+esc(r.n.charAt(0))+'</div><div><strong>'+esc(r.n)+'</strong><div class="gl">Google</div></div></div><div class="st" role="img" aria-label="5/5">&#9733;&#9733;&#9733;&#9733;&#9733;</div><p>'+esc(r.x)+'</p></article>'});$("rvg").innerHTML=s;
 s="";FAQ.forEach(function(q){s+='<details><summary>'+q[lang][0]+'</summary><p>'+q[lang][1]+'</p></details>'});$("faqg").innerHTML=s;
 s="";CASES.forEach(function(c,n){s+='<div><div class="cmp" style="--p:50%"><img src="'+c.a+'" width="720" height="720" alt="'+t.after+' - '+c.t[lang]+'" loading="lazy" decoding="async"><img class="b" src="'+c.b+'" width="720" height="720" alt="'+t.before+' - '+c.t[lang]+'" loading="lazy" decoding="async"><span class="tag tl">'+t.before+'</span><span class="tag tr">'+t.after+'</span><span class="hd"></span><input type="range" min="0" max="100" value="50" aria-label="'+c.t[lang]+'"></div><div class="cap">'+c.t[lang]+'</div></div>'});$("cases").innerHTML=s;

/* تبديل اللغة والقائمة */
$("lang").onclick=function(){lang=lang==="ar"?"fr":"ar";render()};
$("burger").onclick=function(){var o=$("menu").classList.toggle("open");this.setAttribute("aria-expanded",o)};
$("menu").onclick=function(e){if(e.target.tagName==="A")this.classList.remove("open")};
/* اختيار الخدمة من البطاقة */
document.addEventListener("click",function(e){var a=e.target.closest("[data-svc]");if(a){var n=0;SERVICES.forEach(function(v,i){if(v.ar[0]===a.getAttribute("data-svc"))n=i});$("s").value=n}});

/* سلايدر قبل/بعد */
document.addEventListener("input",function(e){var c=e.target.closest(".cmp");if(c&&e.target.type==="range")c.style.setProperty("--p",e.target.value+"%")});

/* Lightbox */
var cur=0;
function show(n){cur=(n+GALLERY.length)%GALLERY.length;var g=GALLERY[cur];$("lbi").src=g.s;$("lbi").alt=g[lang];$("lb").classList.add("open")}
$("galg").onclick=function(e){var b=e.target.closest("button");if(b)show(+b.getAttribute("data-n"))};
$("lbx").onclick=function(){$("lb").classList.remove("open")};
$("lbp").onclick=function(){show(cur-1)};
$("lbn").onclick=function(){show(cur+1)};
$("lb").onclick=function(e){if(e.target===this)this.classList.remove("open")};
document.addEventListener("keydown",function(e){if(!$("lb").classList.contains("open"))return;if(e.key==="Escape")$("lb").classList.remove("open");if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});

/* نموذج الحجز */
function bad(id,eid,msg){$(id).classList.toggle("bad",!!msg);$(eid).textContent=msg||"";return !msg}
$("f").addEventListener("submit",function(e){
 e.preventDefault();var t=T[lang];
 var name=$("n").value.trim(),ph=$("p").value.replace(/[\s.\-()]/g,"").replace(/^(\+213|00213)/,"0"),tm=$("t").value;
 var ok=true;
 ok=bad("n","en",name.length<2?t.e_n:"")&&ok;
 ok=bad("p","ep",/^0[567]\d{8}$/.test(ph)?"":t.e_p)&&ok;
 ok=bad("s","es",$("s").value===""?t.e_s:"")&&ok;
 ok=bad("d","ed",$("d").value===""?t.e_d:"")&&ok;
 ok=bad("t","et",(tm&&tm>=OPEN&&tm<=CLOSE)?"":t.e_t)&&ok;
 if(!ok)return;
 var w=t.wa,note=$("m").value.trim();
 var lines=[w[0],"",w[1]+": "+name,w[2]+": "+ph,w[3]+": "+SERVICES[+$("s").value][lang][0],w[4]+": "+t.days[+$("d").value],w[5]+": "+tm];
 if(note)lines.push(w[6]+": "+note);
 window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(lines.join("\n")),"_blank","noopener");
});
